name: CI/CD

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: cachix/cachix-action@v16
        with:
          name: proxy-flake
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - run: |
          for p in xray sing-box mihomo; do
            echo "=== build $p ==="
            out=$(nix build .#$p --no-link --print-out-paths 2>&1) && \
            cachix push proxy-flake "$out"
          done
