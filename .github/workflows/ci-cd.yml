name: CI/CD

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: cachix/cachix-action@v15
        with:
          name: proxy-flake
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - run: nix build .#xray .#sing-box .#mihomo
      - run: |
          for p in xray sing-box mihomo; do
            cachix push proxy-flake "$(nix path-info .#$p)"
          done
