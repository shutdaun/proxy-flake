name: Update packages

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - run: bash scripts/update.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}